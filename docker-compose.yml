services:
  dev:
    container_name: diff-merge-bot-uros-dev
    image: legohead259/diff_merge_bot_ws-dev:latest
    entrypoint: ["/bin/bash"]
    volumes:
      - ./src/:/ros_ws/src/
      - ./firmware/:/ros_ws/firmware/
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    #   - /dev/bus/usb/:/dev/bus/usb/
  micro-ros-agent:
    image: microros/micro-ros-agent:jazzy
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    # entrypoint: ["/bin/sh"]
    command: [
      # "--help"
      "serial", "-b", "115200", "--dev", "/dev/ttyACM0",
      "-v"
    ]
